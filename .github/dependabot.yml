# Dependency updates.
#
# Security fixes arrive separately, from the repository's "Dependabot security
# updates" setting, which opens a PR per open alert. This file adds the routine
# side: scheduled version bumps, so a dependency is usually already current by
# the time an advisory lands.
#
# Unlike a plugin that bundles nothing, Clew ships its runtime `dependencies`
# (sigma, graphology, dagre, @huggingface/transformers, ...) inside main.js. So
# the two kinds are treated differently below: development-only churn is
# batched into one weekly PR, while every runtime dependency gets its own PR,
# because a bump there changes what installed users actually run.
#
# Dependabot does not touch the `overrides` block in package.json (sharp,
# adm-zip, fast-uri, ...). Those pins exist to force a patched transitive
# version and have to be raised by hand when an advisory lands.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      commit-message:
          prefix: chore(deps)
      open-pull-requests-limit: 5
      ignore:
          # eslint-plugin-obsidianmd (including its latest 0.4.2) declares
          # @eslint/js ^9.30.1 as a peer. A bump to 10 fails to install with
          # ERESOLVE, and Dependabot's own lockfile only got through CI by
          # producing an invalid peer tree. eslint itself can be on 10 (the
          # plugin accepts >=9.19.0); only this package has to stay on 9. Drop
          # this once the plugin lists @eslint/js 10 as supported.
          - dependency-name: '@eslint/js'
            update-types:
                - version-update:semver-major

          # typescript-eslint (8.71.0, the latest) declares typescript
          # >=4.8.4 <6.1.0 as a peer, so TypeScript 7 fails to install with
          # ERESOLVE and the lint toolchain cannot run on it. TypeScript 6 would
          # also need tsconfig changes (moduleResolution node is deprecated,
          # import.meta.dirname in eslint.config.mts stops type-checking) for no
          # gain, so all majors are held. Drop this once typescript-eslint
          # supports 7.
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
      groups:
          # Listed first because Dependabot assigns a package to the first group
          # it matches, and these must not fall into dev-dependencies below.
          #
          # vitest and its coverage provider have to move in one PR:
          # @vitest/coverage-v8 pins vitest to an exact version as a peer, so a
          # PR bumping only one of the two cannot install and its CI is red by
          # construction. Majors are included here for exactly that reason, even
          # though majors are otherwise kept separate.
          vitest:
              patterns:
                  - vitest
                  - '@vitest/*'
              update-types:
                  - major
                  - minor
                  - patch

          # One PR a week for the routine tooling churn rather than one per
          # package. Majors stay separate: those can break the toolchain and
          # deserve their own review. Runtime dependencies are deliberately not
          # grouped (see the header) and so open one PR each.
          dev-dependencies:
              dependency-type: development
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      groups:
          github-actions:
              patterns:
                  - '*'
