<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sigma.js – Gruppenmarkierungen</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f7fb; color: #182235; font: 16px/1.45 system-ui, sans-serif; }
      main { width: min(1180px, calc(100% - 40px)); margin: 36px auto; }
      h1 { margin: 0 0 6px; font-size: 1.7rem; } p { margin: 0; color: #536277; }
      .toolbar { display: flex; gap: 14px; align-items: center; margin: 24px 0 14px; }
      label { font-weight: 650; } select { min-width: 300px; padding: 9px 12px; border: 1px solid #b9c7dc; border-radius: 8px; background: white; font: inherit; }
      #description { min-height: 24px; }
      #graph { position: relative; height: min(68vh, 680px); min-height: 480px; overflow: hidden; border: 1px solid #d7deeb; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px #24385b12; }
      #graph > canvas:not(.group-layer) { z-index: 1; } .group-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Gruppenmarkierungen in Sigma.js</h1>
      <p>Wähle eine Darstellungsart. Jede Variante nutzt dieselben Graphology-Positionen und liegt als Canvas-Layer hinter Sigma.</p>
      <div class="toolbar">
        <label for="style">Darstellung</label>
        <select id="style"></select>
      </div>
      <p id="description"></p>
      <div id="graph"></div>
    </main>
    <script type="module">
      import Graph from "https://cdn.jsdelivr.net/npm/graphology@0.25.4/+esm";
      import Sigma from "https://cdn.jsdelivr.net/npm/sigma@3.0.2/+esm";

      const BLUE = "29,78,216", ids = ["a","b","c","d","e","f","g"], selected = new Set(ids);
      const nodes = [["a",-4.5,2.3],["b",-1.5,3.4],["c",1.6,2.4],["d",2.6,-.6],["e",-.2,-.3],["f",-2.8,-2.2],["g",-5,-.8],["h",5.2,3.3],["i",4.8,-3.1]];
      const edges = [["a","b"],["b","c"],["c","d"],["d","e"],["e","f"],["f","g"],["g","a"],["e","b"],["c","h"],["d","i"]];
      const container = document.getElementById("graph"), select = document.getElementById("style"), description = document.getElementById("description");
      let renderer, resizeObserver;

      function makeGraph(dimOthers = false) {
        const graph = new Graph();
        nodes.forEach(([id,x,y]) => graph.addNode(id, { x, y, label: id.toUpperCase(), size: selected.has(id) ? 12 : 10, color: selected.has(id) ? "#1d4ed8" : dimOthers ? "#d9e0ea" : "#95a1b5" }));
        edges.forEach(([source,target]) => graph.addEdge(source,target,{color:"#d0d8e5",size:1.4}));
        return graph;
      }
      function hull(points) {
        const sorted=[...points].sort((a,b)=>a.x-b.x||a.y-b.y), cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x), half=[];
        for(const p of sorted){while(half.length>1&&cross(half.at(-2),half.at(-1),p)<=0)half.pop();half.push(p)}
        const lower=half.slice(), upper=[]; for(const p of sorted.reverse()){while(upper.length>1&&cross(upper.at(-2),upper.at(-1),p)<=0)upper.pop();upper.push(p)}
        return lower.slice(0,-1).concat(upper.slice(0,-1));
      }
      function polygon(context, points) { context.beginPath();context.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>context.lineTo(p.x,p.y));context.closePath(); }
      function field(points,x,y,radius=62) { return points.reduce((sum,p)=>sum+Math.exp(-((x-p.x)**2+(y-p.y)**2)/(2*radius**2)),0); }
      const fillHull=(context,points,fill=.1,stroke=.9)=>{polygon(context,points);context.fillStyle=`rgba(${BLUE},${fill})`;context.fill();context.lineWidth=2.5;context.strokeStyle=`rgba(${BLUE},${stroke})`;context.stroke();};

      const variants = {
        smooth: { label:"Geglättete Convex Hull", text:"Robuste Standardlösung mit weicher Kontur.", draw(c,p){p=hull(p);const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});c.beginPath();let m=mid(p.at(-1),p[0]);c.moveTo(m.x,m.y);p.forEach((q,i)=>{m=mid(q,p[(i+1)%p.length]);c.quadraticCurveTo(q.x,q.y,m.x,m.y)});c.fillStyle=`rgba(${BLUE},.11)`;c.fill();c.lineWidth=3;c.strokeStyle=`rgba(${BLUE},.88)`;c.stroke();} },
        metaballs: { label:"Metaballs / Bubble Set", text:"Organische Verbindung für nahe beieinanderliegende Cluster.", draw(c,p,w,h){for(let y=0;y<h;y+=3)for(let x=0;x<w;x+=3){const v=field(p,x,y,58);if(v>.22){c.fillStyle=`rgba(${BLUE},${Math.min(.18,.05+v*.06)})`;c.fillRect(x,y,3.5,3.5)}}} },
        rounded: { label:"Abgerundete Gruppenfläche", text:"Großzügige, ruhige Einfassung mit Abstand.", draw(c,p){polygon(c,hull(p));c.fillStyle=`rgba(${BLUE},.07)`;c.fill();c.lineWidth=32;c.lineJoin="round";c.strokeStyle=`rgba(${BLUE},.17)`;c.stroke();c.lineWidth=2;c.strokeStyle=`rgba(${BLUE},.84)`;c.stroke();} },
        concave: { label:"Concave Hull", text:"Eine engere, eingezogene Kontur entlang der geordneten Gruppenpunkte.", draw(c,p){fillHull(c,p)} },
        outline: { label:"Nur Umriss", text:"Unaufdringlich, wenn der Graph bereits sehr dicht ist.", draw(c,p){polygon(c,hull(p));c.setLineDash([9,7]);c.lineWidth=3;c.strokeStyle=`rgba(${BLUE},.9)`;c.stroke();c.setLineDash([])} },
        box: { label:"Abgerundete Bounding Box", text:"Eindeutig und besonders geeignet für kompakte Gruppen.", draw(c,p){const x=Math.min(...p.map(q=>q.x))-24,y=Math.min(...p.map(q=>q.y))-24,w=Math.max(...p.map(q=>q.x))-x+24,h=Math.max(...p.map(q=>q.y))-y+24;c.beginPath();c.roundRect(x,y,w,h,20);c.fillStyle=`rgba(${BLUE},.08)`;c.fill();c.lineWidth=2;c.strokeStyle=`rgba(${BLUE},.8)`;c.stroke();} },
        ellipse: { label:"Ellipse", text:"Eine bewusst weiche, weniger präzise Cluster-Markierung.", draw(c,p){const xs=p.map(q=>q.x),ys=p.map(q=>q.y),x=Math.min(...xs)-24,y=Math.min(...ys)-24,w=Math.max(...xs)-x+24,h=Math.max(...ys)-y+24;c.beginPath();c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);c.fillStyle=`rgba(${BLUE},.08)`;c.fill();c.lineWidth=2;c.strokeStyle=`rgba(${BLUE},.8)`;c.stroke();} },
        capsule: { label:"Kapsel entlang eines Pfads", text:"Zeigt einen Ablauf bzw. einen Pfad durch die Gruppe.", draw(c,p){c.beginPath();c.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>c.lineTo(q.x,q.y));c.lineCap="round";c.lineJoin="round";c.lineWidth=38;c.strokeStyle=`rgba(${BLUE},.15)`;c.stroke();c.lineWidth=3;c.strokeStyle=`rgba(${BLUE},.78)`;c.stroke();} },
        edges: { label:"Kantenbasierte Einfassung", text:"Hinterlegt nur die interne Struktur des Subgraphen.", draw(c,p){const byId=Object.fromEntries(ids.map((id,i)=>[id,p[i]]));c.lineCap="round";c.lineWidth=26;c.strokeStyle=`rgba(${BLUE},.14)`;edges.filter(([a,b])=>selected.has(a)&&selected.has(b)).forEach(([a,b])=>{c.beginPath();c.moveTo(byId[a].x,byId[a].y);c.lineTo(byId[b].x,byId[b].y);c.stroke()})} },
        heatmap: { label:"Dichtekarte / Heatmap", text:"Zeigt die Konzentration der Gruppe statt einer harten Grenze.", draw(c,p,w,h){for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const v=field(p,x,y,74);if(v>.025){c.fillStyle=`rgba(37,99,235,${Math.min(.3,v*.115)})`;c.fillRect(x,y,4.5,4.5)}}} },
        voronoi: { label:"Voronoi-Zellen", text:"Farbige Zellen zeigen die lokale Zugehörigkeit zu jedem Gruppen-Node.", draw(c,p,w,h){const colors=["37,99,235","14,116,144","79,70,229","8,145,178","30,64,175","67,56,202","3,105,161"];for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const ds=p.map(q=>(x-q.x)**2+(y-q.y)**2),d=Math.min(...ds),i=ds.indexOf(d);if(d<4900){c.fillStyle=`rgba(${colors[i]},.13)`;c.fillRect(x,y,3.5,3.5)}}} },
        bracket: { label:"Klammer mit Label", text:"Lässt Gruppeninhalt frei und bleibt auch bei Überlappungen lesbar.", draw(c,p){const x=Math.min(...p.map(q=>q.x))-32,t=Math.min(...p.map(q=>q.y))-20,b=Math.max(...p.map(q=>q.y))+20;c.beginPath();c.moveTo(x+16,t);c.lineTo(x,t);c.lineTo(x,b);c.lineTo(x+16,b);c.lineWidth=3;c.strokeStyle=`rgba(${BLUE},.9)`;c.stroke();c.fillStyle=`rgb(${BLUE})`;c.font="600 13px system-ui";c.fillText("Gruppe A",x-4,t-9)} },
        halo: { label:"Halo + Dimmen", text:"Geeignet für interaktive Auswahl statt dauerhafter Gruppenflächen.", dim:true, draw(c,p){p.forEach(q=>{const g=c.createRadialGradient(q.x,q.y,4,q.x,q.y,42);g.addColorStop(0,"rgba(37,99,235,.30)");g.addColorStop(1,"rgba(37,99,235,0)");c.fillStyle=g;c.beginPath();c.arc(q.x,q.y,42,0,Math.PI*2);c.fill()})} },
        cluster: { label:"Hierarchie / Cluster-Node", text:"Die Gruppe ist eingeklappt und wird als übergeordneter Knoten dargestellt.", cluster:true },
      };

      Object.entries(variants).forEach(([key,variant]) => select.add(new Option(variant.label,key)));
      function render(key) {
        renderer?.kill(); resizeObserver?.disconnect(); container.replaceChildren(); const variant=variants[key]; description.textContent=variant.text;
        if(variant.cluster){const g=new Graph();g.addNode("group",{x:-1.5,y:0,size:36,label:"Gruppe A · 7",color:"#1d4ed8"});g.addNode("h",{x:4,y:2.5,size:13,label:"H",color:"#95a1b5"});g.addNode("i",{x:4,y:-2.5,size:13,label:"I",color:"#95a1b5"});g.addEdge("group","h");g.addEdge("group","i");renderer=new Sigma(g,container,{labelRenderedSizeThreshold:0});return;}
        const graph=makeGraph(variant.dim), layer=document.createElement("canvas");layer.className="group-layer";container.appendChild(layer);renderer=new Sigma(graph,container,{labelRenderedSizeThreshold:0,renderEdgeLabels:false});const current=renderer;
        const redraw=()=>{if(renderer!==current)return;const box=container.getBoundingClientRect(),d=devicePixelRatio||1;layer.width=Math.ceil(box.width*d);layer.height=Math.ceil(box.height*d);layer.style.width=`${box.width}px`;layer.style.height=`${box.height}px`;const c=layer.getContext("2d");c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,box.width,box.height);const layerBox=layer.getBoundingClientRect(),sigmaCanvas=current.getCanvases().nodes,sigmaBox=sigmaCanvas.getBoundingClientRect(),sigmaSize=current.getDimensions();const points=ids.map(id=>{const{x,y}=graph.getNodeAttributes(id),viewport=current.graphToViewport({x,y});return{x:(viewport.x*sigmaBox.width/sigmaSize.width)+sigmaBox.left-layerBox.left,y:(viewport.y*sigmaBox.height/sigmaSize.height)+sigmaBox.top-layerBox.top}});variant.draw(c,points,box.width,box.height);};
        current.getCamera().on("updated",redraw);current.on("afterRender",redraw);resizeObserver=new ResizeObserver(redraw);resizeObserver.observe(container);redraw();
      }
      select.addEventListener("change",()=>render(select.value)); render(select.value="smooth");
    </script>
  </body>
</html>
